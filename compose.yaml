name: cns-outreach

x-app: &app
  image: cns-outreach:local
  build: .
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql://cns:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/cns
    DATABASE_SSL_REQUIRE: "False"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "False"
  volumes:
    - ./secrets:/run/secrets:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: cns
      POSTGRES_USER: cns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cns -d cns"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  setup:
    <<: *app
    profiles: ["ops"]
    command: ["sh", "-c", "python manage.py check --deploy --fail-level ERROR && python manage.py migrate --noinput"]
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    restart: unless-stopped
    command: ["celery", "-A", "cns_app", "worker", "--loglevel=info", "--concurrency=2"]
    stop_grace_period: 16m
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
