<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CNS Outreach</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <style>
    body {
      background-color: #f0f8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card { max-width: 420px; width: 100%; }
    .login-logo { font-size: 2rem; color: #7AB648; }
  </style>
</head>
<body>

  <div class="login-card px-3">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5">

        <div class="text-center mb-4">
          <div class="login-logo mb-2">
            <i class="bi bi-globe-americas"></i>
          </div>
          <h4 class="fw-bold mb-0"><span style="color:#7AB648;">180DC</span> Outreach</h4>
          <p class="text-muted small mt-1">Sign in to your team account</p>
        </div>

        {% if form.errors %}
          <div class="alert alert-danger py-2 small">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            Invalid username or password. Please try again.
          </div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}" />

          <div class="mb-3">
            <label for="id_username" class="form-label fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-white">
                <i class="bi bi-person text-muted"></i>
              </span>
              <input
                type="text"
                name="username"
                id="id_username"
                class="form-control"
                placeholder="Enter your username"
                autofocus
                required
              />
            </div>
          </div>

          <div class="mb-4">
            <label for="id_password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white">
                <i class="bi bi-lock text-muted"></i>
              </span>
              <input
                type="password"
                name="password"
                id="id_password"
                class="form-control"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn w-100 py-2 fw-semibold text-white" style="background-color:#7AB648;">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>

      </div>
    </div>
    <p class="text-center text-muted small mt-3">
      Access is restricted to registered team members only.
    </p>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
